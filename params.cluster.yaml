# A real run on the cluster.
#
# Download this file into your run folder, change the two paths below, and
# submit from that folder:
#
#   curl -O https://raw.githubusercontent.com/EIT-GBI/nf-linear-replicon/main/params.cluster.yaml
#   nano params.cluster.yaml
#
#   export NXF_WORK=/mnt/lustre/projects/bioinformatics/runs/20261023   # before submitting
#   module load nextflow
#   sbatch -J nf-linear-replicon -p cpu -t 2-00:00:00 \
#     --wrap='nextflow run EIT-GBI/nf-linear-replicon -latest \
#             -params-file params.cluster.yaml -profile cluster -resume'
#
# NXF_WORK is where Nextflow keeps its large temporary data -- hundreds of GB of
# intermediate BAMs. Point it well away from this folder so it can be deleted
# wholesale at the end without ever touching the results. Export it in the same
# shell you submit from, every time: without it Nextflow starts a fresh work
# folder and -resume reuses nothing.
#
# The reference folder holds the host genome and one FASTA per construct. The
# samplesheet names them in its reference_genome and additional_reference
# columns, with or without the file extension.
#
# Full guide: docs/running-the-pipeline.md

# The samplesheet is the CSV FILE, not the folder it sits in.
samplesheet:   '/mnt/lustre/projects/bioinformatics/data/ont/wei_linear_replicon/20261023/samplesheet.csv'
reference_dir: '/mnt/lustre/projects/bioinformatics/data/ont/wei_linear_replicon/ref'

# Results are published as hard links into the work folder, and a hard link
# cannot cross filesystems -- so keep outdir inside the run folder.
outdir:        './results'

alignment:
  # 'dorado' reads bam_pass BAMs directly -- no FASTQ round trip, and the
  # MM/ML modified-base tags are never touched. 'minimap2' is the alternative.
  tool: 'dorado'

# The defaults. They are here so that a run records the thresholds it used.
junction:
  min_genome_bp: 500        # the main false-positive filter: both sides must be long
  min_construct_bp: 500
  group_within: 100         # Nanopore breakpoints wobble a few bases
  min_mapping_quality: 60   # below this is repetitive sequence, not trustworthy
  min_reads_to_shortlist: 1 # 1 keeps the single-read background you judge against
  max_rows_to_print: 60

matrix:
  cluster_tolerance: 2000   # breakpoints within this distance are one locus
  min_total_reads: 2

# How many alignments run at once. The limit is DISK, not cores: each one
# writes a sorted BAM about the size of its input (30 GB+ for a PromethION
# barcode) plus a sort temporary of the same again. Too many at once and the
# writes fail -- dorado reports that as
#   Error writing to BAM temporary file, error code -1
# and aborts with exit 134, which looks like a crash but is not.
max_parallel_alignments: 6

# Per-read architecture: slower, and worth it once you have a shortlist
architecture:
  enabled: false
